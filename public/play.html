<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACF Krillion</title><link rel="icon" type="image/png" href="/favicon.png"><link rel="stylesheet" href="/style.css"></head>
<body><main><div class="brand">ACF Krillion</div><div id="app"></div></main>
<script src="/puffer.js"></script>
<script>
let me = null, state = null, skew = 0, lastKey = "", es = null;
try { me = JSON.parse(localStorage.getItem("dd-me") || "null"); } catch {}
function joinForm(err = "") {
  $("app").innerHTML = `<div class="card"><p>Enter the code on the big screen</p>
    <input id="c" placeholder="Room code" maxlength="4" autocapitalize="characters" autocomplete="off" value="${esc(me ? me.code : "")}">
    <input id="n" placeholder="Team name" maxlength="20" autocomplete="off" value="${esc(me ? me.name : "")}">
    <div class="err" id="err">${esc(err)}</div><button onclick="join()">Join game</button></div>`;
}
async function join() {
  const r = await post("/api/join", { code: $("c").value.trim(), name: $("n").value.trim() });
  if (r.error) { $("err").textContent = r.error; return; }
  me = r; try { localStorage.setItem("dd-me", JSON.stringify(me)); } catch {}
  connect();
}
function connect() {
  if (es) es.close();
  es = new EventSource("/api/events?code=" + me.code);
  es.onmessage = e => { state = JSON.parse(e.data); skew = state.now - Date.now(); render(); };
}
async function submit() {
  const text = $("a").value.trim(); if (!text) return;
  const r = await post("/api/answer", { code: me.code, teamId: me.teamId, text });
  if ($("err")) $("err").textContent = r.error || "";
}
function render() {
  const s = state, a = $("app");
  if (s.phase === "question") {
    const key = s.phase + s.q + s.holder; if (key === lastKey) return; lastKey = key; // keep what the team is typing
    const my = s.teams.find(t => t.id === me.teamId) || {}, h = s.teams.find(t => t.id === s.holder) || { name: "?" };
    const body = s.holder === me.teamId
      ? `<div class="card"><p><b>Your turn!</b> Get an answer in.</p><input id="a" maxlength="80" placeholder="Your answer" autocomplete="off" onkeydown="if(event.key==='Enter')submit()">
         <div class="err" id="err"></div><button onclick="submit()">Send</button></div>`
      : !my.alive ? `<div class="card"><p>Your puffer popped. You’re out for this question.</p></div>`
      : my.turns >= s.laps ? `<div class="card"><p>You’re done for this question. Nice!</p></div>`
      : `<div class="card"><p><b>${esc(h.name)}</b> has the puffer</p><p class="mute">${s.next === me.teamId ? "You’re up next. Get ready!" : "Hang tight."}</p></div>`;
    a.innerHTML = `<p class="mute">Question ${s.q + 1} of ${s.total}</p><div class="prompt">${esc(s.prompt)}</div>${puffer()}<div class="timer" id="t"></div>${body}`;
    if ($("a")) $("a").focus();
    tick(s, skew); return;
  }
  lastKey = s.phase + s.q;
  if (s.phase === "lobby") a.innerHTML = `<div class="card"><p>You’re in as <b>${esc(me.name)}</b>.</p><p class="mute">Waiting for the host to start.</p>
      <div class="teams">${s.teams.map(t => `<span class="chip">${esc(t.name)}</span>`).join("")}</div></div>`;
  else if (s.phase === "reveal") {
    const r = s.results.find(x => x.teamId === me.teamId) || { points: 0 };
    a.innerHTML = `<div class="prompt">${esc(s.prompt)}</div><div class="card"><p class="mute">You earned</p><div class="prompt">+${r.points}</div></div>
      <div class="card">${board(s, me.teamId)}</div><p class="mute">Waiting for the next question.</p>`;
  } else a.innerHTML = `<div class="prompt">Final scores</div><div class="card">${board(s, me.teamId)}</div>`;
}
setInterval(() => tick(state, skew), 100);
if (me) post("/api/join", { code: me.code, name: me.name }).then(r => { if (r.error) joinForm(); else { me = r; connect(); } });
else joinForm();
</script></body></html>
