<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krillion · Puffer Party</title><link rel="icon" type="image/png" href="/favicon.png"><link rel="stylesheet" href="/style.css"><script src="/puffer.js"></script></head>
<body><main><div class="brand">ACF KRILLION</div><div class="tag">Puffer Party</div><div id="app"></div></main>
<script>
let me = null, state = null, skew = 0, lastKey = "", es = null;
try { me = JSON.parse(localStorage.getItem("dd-me") || "null"); } catch {}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const post = (p, b) => fetch(p, { method: "POST", body: JSON.stringify(b) }).then(r => r.json());

function joinForm(err = "") {
  $("app").innerHTML = `<div class="card"><p>Enter the code on the big screen</p>
    <input id="c" placeholder="Room code" maxlength="4" autocapitalize="characters" autocomplete="off" value="${esc(me ? me.code : "")}">
    <input id="n" placeholder="Team name" maxlength="20" autocomplete="off" value="${esc(me ? me.name : "")}">
    <div class="err" id="err">${esc(err)}</div><button onclick="join()">Dive in</button></div>`;
}
async function join() {
  const r = await post("/api/join", { code: $("c").value.trim(), name: $("n").value.trim() });
  if (r.error) { $("err").textContent = r.error; return; }
  me = r; try { localStorage.setItem("dd-me", JSON.stringify(me)); } catch {}
  connect();
}
function connect() {
  if (es) es.close();
  es = new EventSource("/api/events?code=" + me.code);
  es.onmessage = e => { state = JSON.parse(e.data); skew = state.now - Date.now(); render(); };
}
async function submit() {
  const el = $("a"), btn = $("go"), text = el.value.trim(); if (!text) return;
  btn.disabled = true;
  const r = await post("/api/answer", { code: me.code, teamId: me.teamId, text });
  btn.disabled = false;
  if (r.error) { $("lock").textContent = r.error; el.select(); } else $("lock").textContent = "";
}
const mine = () => state.teams.find(t => t.id === me.teamId) || { lives: 0 };
const head = s => `<p class="mute">Question ${s.q + 1} of ${s.total}</p><div class="panel"><small>Category ${s.q + 1}</small><div class="prompt">${esc(s.prompt)}</div></div>`;
const livesLine = s => `<p class="lv">${hearts(mine().lives, s.maxLives)}</p>`;

function render() {
  const s = state, a = $("app"), my = s.turn === me.teamId, key = s.phase + s.q + ":" + s.turnN + (my ? "m" : "");
  if (s.phase === "question" && my) {
    if (key !== lastKey) { // build the form once per turn so typing isn't wiped; only the arena refreshes
      lastKey = key;
      a.innerHTML = `${head(s)}${hiddenNote(s)}<div class="turnline mine">Your turn!</div><div id="ar"></div><div class="timer" id="t"></div>${ticker(s)}
        <div class="card"><input id="a" maxlength="80" placeholder="name an answer…" autocomplete="off" onkeydown="if(event.key==='Enter')submit()">
        <button id="go" onclick="submit()">Lock it in</button><p class="err" id="lock"></p></div>${usedList(s)}`;
      $("a").focus();
    }
    $("ar").innerHTML = arena(s, me.teamId);
    return;
  }
  lastKey = key;
  if (s.phase === "lobby") {
    a.innerHTML = `${arena(s, me.teamId)}<div class="card"><p>You’re in as <b>${esc(me.name)}</b>.</p><p class="mute">Waiting for the host to start.</p></div>`;
  } else if (s.phase === "question") {
    const out = mine().lives <= 0;
    a.innerHTML = `${head(s)}${hiddenNote(s)}<div class="turnline">${esc(teamName(s, s.turn))}’s turn</div>${arena(s, me.teamId)}<div class="timer" id="t"></div>
      ${out ? '<p class="mute">You’re out. Watch the rest!</p>' : livesLine(s)}${ticker(s)}${usedList(s)}`;
  } else if (s.phase === "reveal") {
    a.innerHTML = `${head(s)}${hiddenNote(s)}<p class="mute">${endNote(s)}</p>${breakLine(s)}${arena(s, me.teamId)}${livesLine(s)}${ticker(s)}${revealList(s)}`;
  } else {
    const f = finalInfo(s, skew);
    a.innerHTML = `<div class="prompt">${finalTitle(s, f, me.teamId)}</div>${arena(f.masked, me.teamId)}<div class="card final">${finalBoard(s, f, me.teamId)}</div>`;
  }
}
setInterval(() => tickPuffer(state, skew), 100);

if (me) post("/api/join", { code: me.code, name: me.name }).then(r => { if (r.error) joinForm(); else { me = r; connect(); } }); // rejoin after a locked phone
else joinForm();
</script></body></html>
