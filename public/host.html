<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krillion · Puffer Party</title><link rel="icon" type="image/png" href="/favicon.png"><link rel="stylesheet" href="/style.css"><script src="/puffer.js"></script></head>
<body><main><div class="brand">ACF KRILLION</div><div class="tag">Puffer Party</div><div id="app" class="mute">Starting…</div></main>
<script>
let room, state, skew = 0, joinUrl = location.origin;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const post = (p, b) => fetch(p, { method: "POST", body: JSON.stringify(b) }).then(r => r.json());
const act = a => post("/api/host", { code: room.code, hostKey: room.hostKey, action: a });

(async function init() {
  room = await post("/api/create", {});
  if (!room.code) { $("app").textContent = room.error || "Could not start a room."; return; }
  joinUrl = ["localhost", "127.0.0.1"].includes(location.hostname) ? (room.urls[0] || location.origin).replace("http://", "") : location.host;
  subscribe(room.code, st => { state = st; render(); });
})();

const tierKey = s => Object.entries(s.tiers).map(([id, t]) => `<span class="badge t-${id}">${esc(t.label)} ${t.points}</span>`).join(" ");
const head = s => `<p class="mute">Question ${s.q + 1} of ${s.total}</p><div class="panel"><small>Category ${s.q + 1}</small><div class="prompt">${esc(s.prompt)}</div></div>`;

function render() {
  const s = state, a = $("app");
  if (s.phase === "lobby") {
    a.innerHTML = `<p>Open <b>${esc(joinUrl)}</b> on your phone and enter</p><div class="code">${s.code}</div>
      ${arena(s)}<p class="mute">${s.teams.length} of 6 seats taken</p>
      <p class="mute">Take turns naming answers. Miss your ${s.turnMs / 1000} seconds and lose a life. ${s.maxLives} lives each. Highest score wins!</p><p>${tierKey(s)}</p>
      <button onclick="act('start')" ${s.teams.length ? "" : "disabled"}>Start the party</button>`;
  } else if (s.phase === "question") {
    const who = teamName(s, s.turn);
    a.innerHTML = `${head(s)}${hiddenNote(s)}<div class="turnline">${esc(who)}, you're up!</div>${arena(s)}<div class="timer" id="t"></div>${ticker(s)}${usedList(s)}
      <button onclick="act('reveal')">Skip question</button>`;
  } else if (s.phase === "reveal") {
    a.innerHTML = `${head(s)}${hiddenNote(s)}<p class="mute">${endNote(s)}</p>${breakLine(s)}${arena(s)}${ticker(s)}${revealList(s)}
      <button onclick="act('next')">Skip wait</button>`;
  } else {
    const f = finalInfo(s, skew);
    a.innerHTML = `<div class="prompt">${finalTitle(s, f)}</div>${arena(f.masked)}<div class="card final">${finalBoard(s, f)}</div>`;
  }
}
setInterval(() => tickPuffer(state, skew), 100);
</script></body></html>
