<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACF Krillion · Host</title><link rel="icon" type="image/png" href="/favicon.png"><link rel="stylesheet" href="/style.css"></head>
<body><main><div class="brand">ACF Krillion</div><div id="app" class="mute">Starting…</div></main>
<script src="/puffer.js"></script>
<script>
let room, state, skew = 0, joinUrl = location.origin;
const act = a => post("/api/host", { code: room.code, hostKey: room.hostKey, action: a });
(async function init() {
  room = await post("/api/create", {});
  if (!room.code) { $("app").textContent = room.error || "Could not start a room."; return; }
  joinUrl = (room.urls[0] || location.origin).replace("http://", "");
  const es = new EventSource("/api/events?code=" + room.code);
  es.onmessage = e => { state = JSON.parse(e.data); skew = state.now - Date.now(); render(); };
})();
const tierKey = s => Object.entries(s.tiers).map(([id, t]) => `<span class="badge t-${id}">${esc(t.label)} ${t.points}</span>`).join(" ");
function seat(t, i, n, s) {
  const g = -Math.PI / 2 + i * 2 * Math.PI / n, cls = t.id === s.holder ? "hold" : !t.alive ? "out" : "";
  const note = t.id === s.holder ? "has the puffer" : !t.alive ? "popped" : t.id === s.next ? "up next" : "";
  return `<div class="seat ${cls}" style="left:${50 + 41 * Math.cos(g)}%;top:${50 + 41 * Math.sin(g)}%"><b>${esc(t.name)}</b><div class="mute">${t.score}${note ? " · " + note : ""}</div></div>`;
}
function render() {
  const s = state, a = $("app");
  if (s.phase === "lobby") {
    a.innerHTML = `<p>Open <b>${esc(joinUrl)}</b> on your phone and enter</p><div class="code">${s.code}</div>
      <div class="card"><div class="teams">${s.teams.map(t => `<span class="chip">${esc(t.name)}</span>`).join("") || "<span class='mute'>No teams yet</span>"}</div>
      <p class="mute">${s.teams.length} of 6 teams</p></div>
      <p class="mute">Hot potato: the puffer passes team to team. Answer before it pops. Rarer answers score more.</p><p>${tierKey(s)}</p>
      <button onclick="act('start')" ${s.teams.length ? "" : "disabled"}>Start game</button>`;
  } else if (s.phase === "question") {
    a.innerHTML = `<p class="mute">Question ${s.q + 1} of ${s.total}</p><div class="prompt">${esc(s.prompt)}</div>
      <div class="ring"><div class="pbox">${puffer()}<div class="ptime" id="t"></div></div>${s.teams.map((t, i) => seat(t, i, s.teams.length, s)).join("")}</div>
      <div class="card">${s.log.slice(-3).reverse().map(logRow).join("") || "<span class='mute'>Waiting for the first answer…</span>"}</div>
      <button onclick="act('reveal')">End question</button>`;
    tick(s, skew);
  } else if (s.phase === "reveal") {
    a.innerHTML = `<p class="mute">Question ${s.q + 1} of ${s.total}</p><div class="prompt">${esc(s.prompt)}</div>
      <div class="card">${s.log.map(logRow).join("")}</div><div class="card"><div class="mute">Scores</div>${board(s)}</div>
      <button onclick="act('next')">${s.q + 1 >= s.total ? "Final scores" : "Next question"}</button>`;
  } else a.innerHTML = `<div class="prompt">Final scores</div><div class="card">${board(s)}</div>`;
}
setInterval(() => tick(state, skew), 100);
</script></body></html>
