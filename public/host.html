<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krillion · Puffer Party</title><link rel="icon" type="image/png" href="/favicon.png"><link rel="stylesheet" href="/style.css"><script src="/puffer.js"></script></head>
<body><main><div class="brand">KRILLION</div><div class="tag">Puffer Party · one in a krillion.</div><div id="app" class="mute">Starting…</div></main>
<script>
let room, state, skew = 0, joinUrl = location.origin;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const post = (p, b) => fetch(p, { method: "POST", body: JSON.stringify(b) }).then(r => r.json());
const act = a => post("/api/host", { code: room.code, hostKey: room.hostKey, action: a });

(async function init() {
  room = await post("/api/create", {});
  if (!room.code) { $("app").textContent = room.error || "Could not start a room."; return; }
  joinUrl = (room.urls[0] || location.origin).replace("http://", "");
  const es = new EventSource("/api/events?code=" + room.code);
  es.onmessage = e => { state = JSON.parse(e.data); skew = state.now - Date.now(); render(); };
})();

const board = s => [...s.teams].sort((a, b) => b.score - a.score)
  .map(t => `<div class="row"><span>${puffer(teamColor(s, t.id))}${esc(t.name)}</span><b>${t.score}</b></div>`).join("");
const tierKey = s => Object.entries(s.tiers)
  .map(([id, t]) => `<span class="badge t-${id}">${esc(t.label)} ${t.points}</span>`).join(" ");

function render() {
  const s = state, a = $("app");
  if (s.phase === "lobby") {
    a.innerHTML = `<p>Open <b>${esc(joinUrl)}</b> on your phone and enter</p>
      <div class="code">${s.code}</div>
      <div class="card"><div class="teams">${s.teams.map(t => `<span class="chip">${puffer(teamColor(s, t.id))}${esc(t.name)}</span>`).join("") || "<span class='mute'>Waiting for puffers…</span>"}</div>
      <p class="mute">${s.teams.length} of 6 teams in the water</p></div>
      <p>${tierKey(s)}</p>
      <button onclick="act('start')" ${s.teams.length ? "" : "disabled"}>Start the party</button>`;
  } else if (s.phase === "question") {
    a.innerHTML = `<p class="mute">Question ${s.q + 1} of ${s.total}</p>
      <div class="prompt">${esc(s.prompt)}</div>
      <div class="hot" id="hot">${puffer("#ffb020")}</div><div class="timer" id="t"></div>
      <div class="card"><div class="teams">${s.teams.map(t => `<span class="chip ${t.answered ? "done" : ""}">${puffer(teamColor(s, t.id))}${esc(t.name)}${t.answered ? " ✓" : ""}</span>`).join("")}</div></div>
      <button onclick="act('reveal')">Pop it!</button>`;
  } else if (s.phase === "reveal") {
    const last = s.q + 1 >= s.total;
    a.innerHTML = `<p class="mute">Question ${s.q + 1} of ${s.total}</p><div class="prompt">${esc(s.prompt)}</div>
      <div class="card">${s.results.map(r => `<div class="row"><span>${puffer(teamColor(s, r.teamId))}<b>${esc(r.name)}</b>: ${esc(r.text || "no answer")}</span>
        <span><span class="badge ${r.tier ? "t-" + r.tier : ""}">${esc(r.label)}</span> <b>+${r.points}</b></span></div>`).join("")}</div>
      <div class="card"><div class="mute">Depth (score)</div>${board(s)}</div>
      <button onclick="act('next')">${last ? "Final scores" : "Next question"}</button>`;
  } else {
    const top = [...s.teams].sort((x, y) => y.score - x.score)[0];
    a.innerHTML = `<div class="win">${top ? puffer(teamColor(s, top.id)) : ""}</div><div class="prompt">Deepest dive: ${top ? esc(top.name) : ""}</div><div class="card">${board(s)}</div>`;
  }
}
setInterval(() => tickPuffer(state, skew), 100);
</script></body></html>
