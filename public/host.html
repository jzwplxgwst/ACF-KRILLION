<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krillion · Puffer Party</title><link rel="icon" type="image/png" href="/favicon.png"><link rel="stylesheet" href="/style.css"><script src="/puffer.js"></script></head>
<body><main><div class="brand">KRILLION</div><div class="tag">Puffer Party</div><div id="app" class="mute">Starting…</div></main>
<script>
let room, state, skew = 0, joinUrl = location.origin;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const post = (p, b) => fetch(p, { method: "POST", body: JSON.stringify(b) }).then(r => r.json());
const act = a => post("/api/host", { code: room.code, hostKey: room.hostKey, action: a });

(async function init() {
  room = await post("/api/create", {});
  if (!room.code) { $("app").textContent = room.error || "Could not start a room."; return; }
  joinUrl = (room.urls[0] || location.origin).replace("http://", "");
  const es = new EventSource("/api/events?code=" + room.code);
  es.onmessage = e => { state = JSON.parse(e.data); skew = state.now - Date.now(); render(); };
})();

const tierKey = s => Object.entries(s.tiers).map(([id, t]) => `<span class="badge t-${id}">${esc(t.label)} ${t.points}</span>`).join(" ");
const head = s => `<p class="mute">Question ${s.q + 1} of ${s.total}</p><div class="panel"><small>Category ${s.q + 1}</small><div class="prompt">${esc(s.prompt)}</div></div>`;

function render() {
  const s = state, a = $("app");
  if (s.phase === "lobby") {
    a.innerHTML = `<p>Open <b>${esc(joinUrl)}</b> on your phone and enter</p><div class="code">${s.code}</div>
      ${arena(s)}<p class="mute">${s.teams.length} of 6 seats taken</p>
      <p class="mute">Take turns naming answers. Miss your ${s.turnMs / 1000} seconds and lose a life. ${s.maxLives} lives each. Last one standing wins!</p><p>${tierKey(s)}</p>
      <button onclick="act('start')" ${s.teams.length ? "" : "disabled"}>Start the party</button>`;
  } else if (s.phase === "question") {
    const who = teamName(s, s.turn);
    a.innerHTML = `${head(s)}<div class="turnline">${esc(who)}, you're up!</div>${arena(s)}<div class="timer" id="t"></div>${ticker(s)}${usedList(s)}
      <button onclick="act('reveal')">Skip question</button>`;
  } else if (s.phase === "reveal") {
    const last = s.q + 1 >= s.total;
    a.innerHTML = `${head(s)}<p class="mute">${endNote(s)}</p>${arena(s)}${ticker(s)}${revealList(s)}
      <button onclick="act('next')">${last ? "Final scores" : "Next question"}</button>`;
  } else {
    const top = ranking(s), w = top[0];
    a.innerHTML = `<div class="prompt">${w && w.lives > 0 ? "Last one standing: " + esc(w.name) : "Everyone's out!"}</div>${arena(s)}
      <div class="card">${top.map((t, i) => `<div class="row"><span>${i + 1}. ${esc(t.name)} <span class="lv">${hearts(t.lives, s.maxLives)}</span></span><b>${t.score}</b></div>`).join("")}</div>`;
  }
}
setInterval(() => tickPuffer(state, skew), 100);
</script></body></html>
